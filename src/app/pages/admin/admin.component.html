<div class="admin-container">

  <h2>Painel Administrativo - IFSC</h2>

  <form
    [formGroup]="eventoForm"
    (ngSubmit)="salvar()"
    class="form-publicacao">

    <div class="form-group">
      <img src="/logo.png" alt="Logo IFSC" class="logo-ifsc">
      <label for="titulo">Título</label>

      <input
        id="titulo"
        type="text"
        formControlName="titulo"
        placeholder="Ex: Workshop Spring Boot">

      <small
        *ngIf="eventoForm.get('titulo')?.invalid && eventoForm.get('titulo')?.touched">

        Informe o título.

      </small>

    </div>

    <div class="form-group">

      <label for="tipo">Tipo</label>

      <select
        id="tipo"
        formControlName="tipo">

        <option value="CURSO">Curso</option>
        <option value="EVENTO">Evento</option>

      </select>

    </div>

    <div class="form-group">

      <label for="data">Data</label>

      <input
        id="data"
        type="date"
        formControlName="data">

    </div>

    <div class="form-group">

      <label for="descricao">Descrição</label>

      <textarea
        id="descricao"
        rows="5"
        formControlName="descricao"
        placeholder="Descrição do conteúdo">
      </textarea>

    </div>

    <button
      type="submit"
      [disabled]="eventoForm.invalid">

      Publicar Conteúdo

    </button>

  </form>

  <hr>

  <h3>Conteúdos Publicados</h3>

  <div *ngIf="listaConteudos.length === 0">

    Nenhum conteúdo cadastrado.

  </div>

  <div
    *ngFor="let item of listaConteudos"
    class="card-conteudo">

    <h4>

      {{ item.titulo }}

      <span class="badge">

        {{ item.tipo }}

      </span>

    </h4>

    <p>

      <strong>Data:</strong>

      {{ item.data | date:'dd/MM/yyyy' }}

    </p>

    <p>

      {{ item.descricao }}

    </p>

  </div>

</div>
