<div class="admin-container">
  <h2>Painel Administrativo IFSC</h2>
  
  <!-- Formulário de Cadastro de Conteúdo -->
  <form [formGroup]="publicacaoForm" (ngSubmit)="publicar()" class="form-publicacao">
    <div class="form-group">
      <label for="titulo">Título do Conteúdo</label>
      <input id="titulo" formControlName="titulo" type="text" placeholder="Ex: Workshop de Spring Boot">
    </div>

    <div class="form-group">
      <label for="tipo">Tipo</label>
      <select id="tipo" formControlName="tipo">
        <option value="curso">Curso</option>
        <option value="evento">Evento</option>
      </select>
    </div>

    <div class="form-group">
      <label for="data">Data de Realização / Início</label>
      <input id="data" formControlName="data" type="date">
    </div>

    <div class="form-group">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" formControlName="descricao" rows="4"></textarea>
    </div>

    <button type="submit" [disabled]="publicacaoForm.invalid">Publicar Conteúdo</button>
  </form>

  <!-- Listagem dos Conteúdos Cadastrados -->
  <div class="lista-conteudos">
    <h3>Conteúdos Publicados</h3>
    <div *ngFor="let item of conteudos" class="card-conteudo" [ngClass]="item.tipo">
      <h4>{{ item.titulo }} <span class="badge">{{ item.tipo | uppercase }}</span></h4>
      <p><small>Data: {{ item.data | date:'dd/MM/yyyy' }}</small></p>
      <p>{{ item.descricao }}</p>
    </div>
  </div>
</div>
